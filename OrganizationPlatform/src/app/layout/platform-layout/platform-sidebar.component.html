<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-logo">⬡</div>
      <div class="brand-text">
        <span class="brand-name">OrgPlatform</span>
        <span class="brand-tag">System Admin</span>
      </div>
    </div>
  </div>

  <nav class="nav-body">
    <span class="nav-group-label">Overview</span>
    <a routerLink="/admin/dashboard"     routerLinkActive="active" class="nav-item">
      <span class="icon">🏠</span><span>Dashboard</span>
    </a>
    <a routerLink="/admin/organizations" routerLinkActive="active" class="nav-item">
      <span class="icon">🏢</span><span>Organizations</span>

    <span class="nav-group-label">Management</span>
    <a routerLink="/admin/users"       routerLinkActive="active" class="nav-item">

    </a>

      <span class="icon">📋</span><span>Audit Logs</span>
    </a>
    <a routerLink="/admin/permissions" routerLinkActive="active" class="nav-item">
      <span class="icon">🔑</span><span>Permissions</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="authService.logout()">
      <span>⎋</span><span>Sign out</span>
    </button>
